# cargo-deny policy. See docs/BUILD_SPEC.md sections 9 and 11.3.

[graph]
all-features = true
# Desktop only. Tauri lists HTTP crates for phone builds, which we never make.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, build time only, comes with Tauri" },
]

[licenses]
version = 2
# Permissive licences only. No GPL, AGPL or LGPL.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
# MPL-2.0 crates that Tauri cannot do without. Only these five names were approved, on 25 November 2026.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Only kh-update may use an HTTP client. Every crate below may be pulled in
# only by kh-update (the wrapper list). Anyone else depending on one fails CI.
deny = [
  { crate = "reqwest", wrappers = ["kh-update"] },
  { crate = "hyper", wrappers = ["kh-update"] },
  { crate = "ureq", wrappers = ["kh-update"] },
  { crate = "isahc", wrappers = ["kh-update"] },
  { crate = "attohttpc", wrappers = ["kh-update"] },
  { crate = "minreq", wrappers = ["kh-update"] },
  { crate = "surf", wrappers = ["kh-update"] },
  { crate = "curl", wrappers = ["kh-update"] },
  { crate = "curl-sys", wrappers = ["kh-update"] },
  { crate = "openssl", wrappers = ["kh-update"] },
  { crate = "native-tls", wrappers = ["kh-update"] },
  # Only the shell may know about the window toolkit, so it stays replaceable.
  # The dialog plugin (and the file plugin it brings) are used by the shell alone, from Rust.
  { crate = "tauri", wrappers = ["kh-app", "tauri-plugin-dialog", "tauri-plugin-fs"] },
  { crate = "tauri-plugin-dialog", wrappers = ["kh-app"] },
  { crate = "tauri-plugin-fs", wrappers = ["tauri-plugin-dialog"] },
  # Updates belong to kh-update. This plugin would put an HTTP client in the shell.
  { crate = "tauri-plugin-updater" },
  # Telemetry and crash upload are never allowed anywhere.
  { crate = "sentry" },
  { crate = "sentry-core" },
  { crate = "opentelemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
