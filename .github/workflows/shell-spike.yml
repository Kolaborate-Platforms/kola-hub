name: Shell spike (sizes)

# Throwaway: deleted with the losing demo once the shell is signed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "spikes/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  tauri:
    name: Tauri size
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install front end tools
        working-directory: spikes/tauri-grid
        run: pnpm install --frozen-lockfile
      - name: Bundle
        working-directory: spikes/tauri-grid
        run: pnpm tauri build
      - name: Size
        shell: pwsh
        run: |
          Get-ChildItem -Recurse spikes/tauri-grid -Include *.exe |
            Where-Object { $_.FullName -match 'release' -and $_.FullName -notmatch '\\(build|deps|node_modules)\\' } |
            ForEach-Object { "{0}: {1:N2} MB" -f $_.Name, ($_.Length / 1MB) } |
            Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-grid
          path: spikes/tauri-grid/**/release/bundle/**/*.exe
