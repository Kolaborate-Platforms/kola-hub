name: Installer

# Builds the Windows installer and the Mac disk image, checks their size and smoke tests them.
# A version tag also publishes them as a test release.
# The Windows runner has internet and WebView2, so it cannot prove the offline Windows 10 install.
# That stays the manual plan in docs/benchmarks/WEBVIEW2.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/kh-app/**"
      - "crates/kh-mcp/**"
      - "scripts/prepare-sidecar.mjs"
      - "scripts/smoke-windows.ps1"
      - "scripts/smoke-mac.sh"
      - ".github/release-notes.md"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.0"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build the offline installer
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-sidecar.mjs
          pnpm tauri build --config crates/kh-app/tauri.release.json
      # Both builds write the same file name, so each one is moved away before the next.
      - name: Keep the offline installer
        shell: bash
        run: |
          mkdir -p target/installers/offline target/installers/small
          for file in target/release/bundle/nsis/*-setup.exe; do
            mv "$file" "target/installers/offline/$(basename "${file%-setup.exe}")-offline-setup.exe"
          done
      - name: Build the small installer
        shell: bash
        run: |
          pnpm tauri build --config crates/kh-app/tauri.release.json --config crates/kh-app/tauri.online.json
          mv target/release/bundle/nsis/*-setup.exe target/installers/small/
      - name: Test file
        run: cargo run --release -p kh-formats --example gen_big_csv -- 100000 100k.csv
      - name: Install, run, measure, uninstall (small installer)
        shell: powershell
        run: ./scripts/smoke-windows.ps1 -InstallerDir target/installers/small -InstallerLimitMB 25 -Csv 100k.csv
      - name: Install, run, measure, uninstall (offline installer)
        shell: powershell
        run: ./scripts/smoke-windows.ps1 -InstallerDir target/installers/offline -InstallerLimitMB 300 -Csv 100k.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kola-hub-windows
          path: target/installers/*/*-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.0"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build disk image
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-sidecar.mjs
          pnpm tauri build --bundles dmg --config crates/kh-app/tauri.release.json --config crates/kh-app/tauri.macos.release.json
      - name: Check the disk image
        run: bash scripts/smoke-mac.sh target/release/bundle/dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kola-hub-mac
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish the test release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version crates/kh-app/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match app version $version"; exit 1; }
          gh run download "$GITHUB_RUN_ID" --dir "$RUNNER_TEMP/built"
          mkdir "$RUNNER_TEMP/release"
          # GitHub rewrites spaces in file names, which would break the checksum list.
          find "$RUNNER_TEMP/built" -type f \( -name '*-setup.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              cp "$file" "$RUNNER_TEMP/release/${name// /-}"
            done
          cd "$RUNNER_TEMP/release"
          sha256sum ./*-setup.exe ./*.dmg | sed 's| \./| |' > SHA256SUMS
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Kola Hub $version (test build)" --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"
