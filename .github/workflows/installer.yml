name: Installer

# Task 9. Builds the Windows installer, checks its size and smoke tests it.
# This runner has internet and WebView2, so it cannot prove the offline Windows 10 install.
# That stays the manual plan in docs/benchmarks/WEBVIEW2.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "crates/kh-app/**"
      - "crates/kh-mcp/**"
      - "scripts/prepare-sidecar.mjs"
      - "scripts/smoke-windows.ps1"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.0"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build installer
        run: |
          pnpm install --frozen-lockfile
          node scripts/prepare-sidecar.mjs
          pnpm tauri build --config crates/kh-app/tauri.release.json
      - name: Test file
        run: cargo run --release -p kh-formats --example gen_big_csv -- 100000 100k.csv
      - name: Install, run, measure, uninstall
        shell: powershell
        run: ./scripts/smoke-windows.ps1 -InstallerDir target/release/bundle/nsis -Csv 100k.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kola-hub-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS
