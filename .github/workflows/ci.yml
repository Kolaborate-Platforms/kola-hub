name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is required (spec 11.1). Linux is a cheap second opinion.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux libraries for the window toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Front end (types and build)
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build:ui
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass
      - name: Interface types match the commands
        if: runner.os == 'Linux'
        run: bash scripts/check-contract.sh
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Deny (licences, bans, advisories)
        run: cargo deny check
      - name: File size limit (1,500 lines)
        if: runner.os == 'Linux'
        run: bash scripts/check-file-size.sh
