name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is required (spec 11.1). Linux is a cheap second opinion.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Linux libraries for the window toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Front end (types and build)
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build:ui
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --no-tests=pass --no-fail-fast
      - name: Interface types match the commands
        if: runner.os == 'Linux'
        run: bash scripts/check-contract.sh
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Deny (licences, bans, advisories)
        run: cargo deny check
      - name: File size limit (1,500 lines)
        if: runner.os == 'Linux'
        run: bash scripts/check-file-size.sh
