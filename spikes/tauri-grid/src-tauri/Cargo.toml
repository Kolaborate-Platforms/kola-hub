[package]
name = "tauri-grid"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
publish = false

[lib]
name = "tauri_grid_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kh-core = { path = "../../../crates/kh-core" }
kh-formats = { path = "../../../crates/kh-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lints]
workspace = true
