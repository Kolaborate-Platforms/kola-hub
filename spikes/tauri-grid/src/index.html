<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kola Hub Grid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-info">
        <span class="title">Kola Hub Grid</span>
        <span id="status" class="status">Loading...</span>
      </div>
      <button id="go-last-btn" type="button">Go to last row</button>
    </header>
    <main class="grid-shell">
      <div id="error-banner" class="error-banner" hidden></div>
      <div id="grid-header" class="grid-header" role="row"></div>
      <div id="grid-viewport" class="grid-viewport" tabindex="0">
        <div id="grid-spacer" class="grid-spacer">
          <div id="grid-rows" class="grid-rows"></div>
        </div>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
