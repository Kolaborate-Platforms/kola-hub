[package]
name = "kh-app"
description = "The window shell and command layer. Thin and replaceable."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kh_app"
crate-type = ["lib"]

[[bin]]
name = "kola-hub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kh-core = { path = "../kh-core" }
kh-formats = { path = "../kh-formats" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[lints]
workspace = true
