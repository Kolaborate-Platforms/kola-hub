[package]
name = "kh-backup"
description = "Sealed passphrase backup and restore."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
aead-stream = { version = "0.6.0", features = ["alloc"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
kh-store = { version = "0.1.0", path = "../kh-store" }
sha2 = "0.11.1"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
